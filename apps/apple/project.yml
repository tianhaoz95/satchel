name: Satchel
options:
  bundleIdPrefix: dev.satchel
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Simulator/CI builds are ad-hoc signed ("-") so entitlements (Keychain, app groups) apply
    # without a team; release builds set DEVELOPMENT_TEAM and a real identity in CI.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

packages:
  SatchelKit:
    path: Packages/SatchelKit

targets:
  Satchel:
    type: application
    platform: iOS
    sources:
      - path: Satchel
        excludes: ["Satchel.entitlements"]
      - Shared
    dependencies:
      - package: SatchelKit
      - target: SatchelShare
      - target: SatchelWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satchel.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Satchel
    info:
      path: Satchel/Info.plist
      properties:
        CFBundleDisplayName: Satchel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Satchel uses the camera to scan your node's pairing code and to scan documents into your vault."
        NSFaceIDUsageDescription: "Face ID unlocks the key that signs your approvals and shows values agents send you."
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: dev.satchel.pair
            CFBundleURLSchemes: [satchel]
        NSAppTransportSecurity:
          # Nodes on the home network may be reached over plain HTTP before a relay is set up.
          NSAllowsLocalNetworking: true
        SatchelKeychainGroup: "$(AppIdentifierPrefix)dev.satchel.shared"
    entitlements:
      path: Satchel/Satchel.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.satchel.shared"]
        com.apple.security.application-groups: [group.dev.satchel]

  SatchelShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SatchelShare
        excludes: ["SatchelShare.entitlements"]
      - Shared/Theme.swift
    dependencies:
      - package: SatchelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satchel.ios.share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SatchelShare/Info.plist
      properties:
        CFBundleDisplayName: Satchel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SatchelKeychainGroup: "$(AppIdentifierPrefix)dev.satchel.shared"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: SatchelShare/SatchelShare.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.satchel.shared"]

  SatchelWatch:
    type: application
    platform: watchOS
    sources:
      - path: SatchelWatch
        excludes: ["SatchelWatch.entitlements"]
      - Shared
    dependencies:
      - package: SatchelKit
      - target: SatchelWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satchel.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: SatchelWatch/Info.plist
      properties:
        CFBundleDisplayName: Satchel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.satchel.ios
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SatchelWatch/SatchelWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.satchel]

  SatchelWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: SatchelWatchWidgets
        excludes: ["SatchelWatchWidgets.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.satchel.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: SatchelWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Satchel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SatchelWatchWidgets/SatchelWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.satchel]

schemes:
  Satchel:
    build:
      targets:
        Satchel: all
    run:
      config: Debug
  SatchelWatch:
    build:
      targets:
        SatchelWatch: all
    run:
      config: Debug
