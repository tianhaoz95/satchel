<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Satchel</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="/ui/logo.svg">
<link rel="apple-touch-icon" href="/ui/logo.svg">
<link rel="stylesheet" href="/ui/style.css">
<style>
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.top svg{width:22px;height:22px}.top b{flex:1}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:2}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;color:var(--muted);text-decoration:none;font-size:.75rem}
.tabs a.active{color:var(--accent);font-weight:600}.tabs svg{width:20px;height:20px}
.screen{padding:16px;max-width:560px;margin:0 auto}
.secret{font-family:var(--mono);font-size:1.3rem;letter-spacing:.06em;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:8px 0;word-break:break-all}
.capture{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer}
.capture svg{width:40px;height:40px;color:var(--accent)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:.65rem;padding:0 5px;position:absolute;margin-left:14px;margin-top:-4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
